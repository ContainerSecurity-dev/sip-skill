name: Validate skill
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test scripts/*.test.mjs
      - run: python3 scripts/test-package-skill.py
      - run: python3 scripts/test-package-stores.py
      - run: python3 scripts/test-publish-oci.py
      - run: python3 scripts/package-skill.py --check
      - run: python3 scripts/package-skill.py
      - run: python3 scripts/package-stores.py "dist/sip-$(cat VERSION).tar.gz"
      - run: git diff --check
